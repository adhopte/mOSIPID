name: Build Android APKs
# Builds installable (sideload) release APKs for both apps, signed with the Expo debug key, and publishes them as a GitHub Release.
#   • Push a tag:        git tag apk-v0.1.0 && git push origin apk-v0.1.0
#   • Or run manually:   Actions → "Build Android APKs" → Run workflow (server URLs can be set there)
on:
  push:
    tags: ['apk-v*']
  workflow_dispatch:
    inputs:
      admin_url:    { description: 'Branding portal URL',  default: 'https://mosipid-admin.onrender.com' }
      issuer_url:   { description: 'Issuer URL',           default: 'https://mosipid-issuer.onrender.com' }
      verifier_url: { description: 'Verifier URL',         default: 'https://mosipid-verifier.onrender.com' }

permissions:
  contents: write

env:
  EXPO_PUBLIC_ADMIN_URL:    ${{ inputs.admin_url    || vars.ADMIN_URL    || 'https://mosipid-admin.onrender.com' }}
  EXPO_PUBLIC_ISSUER_URL:   ${{ inputs.issuer_url   || vars.ISSUER_URL   || 'https://mosipid-issuer.onrender.com' }}
  EXPO_PUBLIC_VERIFIER_URL: ${{ inputs.verifier_url || vars.VERIFIER_URL || 'https://mosipid-verifier.onrender.com' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [wallet, proximity-verifier]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Install shared packages (repo root)
        run: npm ci
      - name: Install app dependencies
        run: npm ci --legacy-peer-deps
        working-directory: apps/${{ matrix.app }}
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        working-directory: apps/${{ matrix.app }}
      - name: Build release APK (arm64 + armv7)
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
        working-directory: apps/${{ matrix.app }}/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      - name: Name the artifact
        run: cp apps/${{ matrix.app }}/android/app/build/outputs/apk/release/app-release.apk "mosipid-${{ matrix.app }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: mosipid-${{ matrix.app }}-apk
          path: mosipid-${{ matrix.app }}.apk
          if-no-files-found: error

  release:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: apks, merge-multiple: true }
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('apk-run-{0}', github.run_number) }}
        run: |
          ls -la apks
          gh release create "$TAG" apks/*.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Android APKs ($TAG)" \
            --notes "Sideload builds of the MOSIP-ID wallet and proximity verifier. Signed with the Expo debug key (not for the Play Store). Servers: $EXPO_PUBLIC_ISSUER_URL"

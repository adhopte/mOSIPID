plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.mosipidcapture'
version = '0.1.0'

android {
  namespace "expo.modules.mosipidcapture"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

// Same workaround expo-camera uses: React Native pulls an empty listenablefuture stub that breaks CameraX at compile time.
configurations.configureEach {
  resolutionStrategy.force "com.google.guava:listenablefuture:1.0"
}

dependencies {
  def camerax_version = "1.6.0"
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"
  implementation "androidx.appcompat:appcompat:1.7.1"
  implementation "androidx.exifinterface:exifinterface:1.4.2"
  implementation "androidx.core:core-ktx:1.18.0"
  // bundled (offline) ML Kit models – the same libraries as the reference app
  implementation "com.google.mlkit:text-recognition:16.0.1"
  implementation "com.google.mlkit:face-detection:16.1.7"
}

<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Issuer</title><link rel="stylesheet" href="/shared/base.css"><link rel="icon" href="/shared/brand/favicon.png"></head>
<body>
<header class="top"><div class="in"><img class="logo" alt=""><a class="brand" data-brand-name href="/" style="color:#fff;text-decoration:none">Issuer</a><span data-lang-switcher></span></div></header>
<main>
<section class="card" style="max-width:460px;margin:24px auto">
  <h1 data-i18n="i.auth.title">University sign-in</h1>
  <p class="muted" data-i18n="i.auth.lead">Sign in to allow your wallet to receive your degree attestation.</p>
  <form id="f">
    <label for="sid" data-i18n="i.uni.studentId">University ID</label><input id="sid" required autocomplete="username" autocapitalize="characters">
    <label for="dob" data-i18n="i.uni.dob">Date of birth</label><input id="dob" type="date" required autocomplete="bday">
    <div id="err" class="msg err hidden"></div>
    <p><button class="btn" style="width:100%" data-i18n="i.auth.signin">Sign in</button></p>
  </form>
</section>
</main>
<footer data-i18n="common.mockNotice">Demonstration system using a mock IACA. Not for production use.</footer>
<script src="/config.js"></script><script src="/shared/app.js"></script>
<script>
(async () => {
  await App.init({ tenant: 'issuer-university', titleKey: 'i.auth.title' });
  const q = new URLSearchParams(location.search); const $ = (i) => document.getElementById(i);
  if (q.get('lang') && q.get('lang') !== App.lang) await App.setLang(q.get('lang'));
  $('f').onsubmit = async (e) => {
    e.preventDefault(); $('err').classList.add('hidden');
    try { const r = await App.api('/authorize/login', { method: 'POST', body: { req: q.get('req'), studentId: $('sid').value, dob: $('dob').value } }); location.href = r.redirect; }
    catch (err) { $('err').textContent = err.status === 401 ? App.t('err.invalid_credentials') : App.t('err.generic'); $('err').classList.remove('hidden'); }
  };
})();
</script>
</body></html>
